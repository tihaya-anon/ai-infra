# yaml-language-server: $schema=../deploy/schemas/aijob-v1alpha1.schema.json
apiVersion: infra.example.io/v1alpha1
kind: AIJob
metadata:
  name: demo-training
spec:
  workers: 4
  gpuPerWorker: 2
  gpuResource: example.com/gpu
  topology:
    preference: nvlink
  image: ai-infra-lab:dev
  args: ["--mode=complete", "--duration=5s"]
