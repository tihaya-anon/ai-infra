# yaml-language-server: $schema=../deploy/schemas/aijob-v1alpha1.schema.json
apiVersion: infra.example.io/v1alpha1
kind: AIJob
metadata:
  name: selected-worker-failure
  labels:
    kueue.x-k8s.io/queue-name: training
spec:
  workers: 4
  gpuPerWorker: 1
  gpuResource: example.com/gpu
  topology: any
  image: ai-infra-lab:dev
  jobSetOverrides:
    failurePolicy:
      rules:
        - name: fail-workers
          action: FailJobSet
  args: ["--mode=complete", "--duration=2s", "--fail-indexes=1"]
