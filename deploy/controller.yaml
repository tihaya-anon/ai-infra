apiVersion: apps/v1
kind: Deployment
metadata:
  name: aijob-controller
  namespace: ai-infra-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aijob-controller
  template:
    metadata:
      labels:
        app: aijob-controller
    spec:
      serviceAccountName: aijob-controller
      containers:
        - name: controller
          image: ai-infra-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["/controller"]
