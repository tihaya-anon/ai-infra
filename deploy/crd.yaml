apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aijobs.infra.example.io
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    plural: aijobs
    singular: aijob
    kind: AIJob
    shortNames: [aijob]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Workers
          type: integer
          jsonPath: .spec.workers
        - name: Completed
          type: string
          jsonPath: .status.conditions[?(@.type=="Completed")].status
        - name: Failed
          type: string
          jsonPath: .status.conditions[?(@.type=="Failed")].status
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: AIJob spec is immutable; recreate the AIJob to change the workload
              required: [workers, gpuPerWorker]
              properties:
                workers:
                  type: integer
                  minimum: 1
                gpuPerWorker:
                  type: integer
                  minimum: 1
                gpuResource:
                  type: string
                  default: example.com/gpu
                topology:
                  type: string
                  enum: [any, nvlink, pcie, same-rack]
                  default: any
                image:
                  type: string
                  default: ai-infra-lab:dev
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
