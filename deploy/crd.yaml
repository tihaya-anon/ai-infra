---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: aijobs.infra.example.io
spec:
  group: infra.example.io
  names:
    kind: AIJob
    listKind: AIJobList
    plural: aijobs
    shortNames:
    - aijob
    singular: aijob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workers
      name: Workers
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Completed")].status
      name: Completed
      type: string
    - jsonPath: .status.conditions[?(@.type=="Failed")].status
      name: Failed
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              args:
                items:
                  type: string
                type: array
              gpuPerWorker:
                format: int64
                minimum: 1
                type: integer
              gpuResource:
                default: example.com/gpu
                type: string
              image:
                default: ai-infra-lab:dev
                type: string
              topology:
                default: any
                enum:
                - any
                - nvlink
                - pcie
                - same-rack
                type: string
              workers:
                format: int32
                minimum: 1
                type: integer
            required:
            - gpuPerWorker
            - workers
            type: object
            x-kubernetes-validations:
            - message: AIJob spec is immutable; recreate the AIJob to change the workload
              rule: self == oldSelf
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
