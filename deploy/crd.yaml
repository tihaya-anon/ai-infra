apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aijobs.infra.example.io
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    plural: aijobs
    singular: aijob
    kind: AIJob
    shortNames: [aijob]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Workers
          type: integer
          jsonPath: .spec.workers
        - name: Running
          type: integer
          jsonPath: .status.running
        - name: Pending
          type: integer
          jsonPath: .status.pending
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [workers, gpuPerWorker]
              properties:
                workers:
                  type: integer
                  minimum: 1
                gpuPerWorker:
                  type: integer
                  minimum: 1
                gpuResource:
                  type: string
                  default: example.com/gpu
                topology:
                  type: string
                  enum: [any, nvlink, pcie, same-rack]
                  default: any
                image:
                  type: string
                  default: ai-infra-lab:dev
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
