apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-scheduler-config
  namespace: ai-infra-system
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    clientConnection:
      kubeconfig: ""
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: ai-scheduler
        plugins:
          score:
            enabled:
              - name: GPUTopology
                weight: 5
        pluginConfig:
          - name: NodeResourcesFit
            args:
              scoringStrategy:
                type: MostAllocated
                resources:
                  - name: example.com/gpu
                    weight: 1
