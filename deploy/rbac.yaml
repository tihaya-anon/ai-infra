apiVersion: v1
kind: Namespace
metadata:
  name: ai-infra-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-infra-lab
  namespace: ai-infra-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-infra-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
  - apiGroups: ["infra.example.io"]
    resources: ["aijobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["infra.example.io"]
    resources: ["aijobs/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-infra-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-infra-lab
subjects:
  - kind: ServiceAccount
    name: ai-infra-lab
    namespace: ai-infra-system
