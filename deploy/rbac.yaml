apiVersion: v1
kind: Namespace
metadata:
  name: ai-infra-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aijob-controller
  namespace: ai-infra-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aijob-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["infra.example.io"]
    resources: ["aijobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["infra.example.io"]
    resources: ["aijobs/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aijob-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aijob-controller
subjects:
  - kind: ServiceAccount
    name: aijob-controller
    namespace: ai-infra-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-scheduler
  namespace: ai-infra-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: ai-scheduler
    namespace: ai-infra-system
